name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check plugin manifests parse
        run: |
          python -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
      - name: Validate examples
        run: |
          for file in examples/ticket-routing.json examples/high-confidence.json examples/ambiguous.json examples/spam-decision.json; do
            python skills/decide/scripts/validate.py "$file"
          done
      - name: Validate a batch of judgments
        run: python skills/decide/scripts/validate.py examples/batch-triage.json
      - name: Gate one judgment from a batch
        run: |
          python skills/decide/scripts/gate.py \
            examples/batch-triage.json examples/policy.json --judgment department --consequence low
      - name: Gate an automatable decision
        run: |
          python skills/decide/scripts/gate.py \
            examples/high-confidence.json examples/policy.json --consequence low
      - name: An abstention exits 30, not 0
        run: |
          set +e
          python skills/decide/scripts/gate.py \
            examples/ambiguous.json examples/policy.json --consequence low
          test $? -eq 30
      - name: Tiered policy gates by action cost
        run: |
          set -e
          python skills/decide/scripts/gate.py examples/spam-decision.json \
            examples/policy-tiered.json --action auto_delete > /dev/null
          set +e
          python skills/decide/scripts/gate.py examples/spam-decision.json \
            examples/policy-tiered.json --action ban_account > /dev/null
          test $? -eq 10
      - name: Calibration artifact rebuilds identically
        run: |
          python skills/decide/scripts/calibrate.py examples/predictions-labelled.jsonl \
            --artifact /tmp/calibration.json --min-samples 30 > /dev/null
          python -c "import json,sys; a=json.load(open('/tmp/calibration.json')); b=json.load(open('examples/calibration.json')); sys.exit(0 if a==b else 'examples/calibration.json is stale; rerun calibrate.py --artifact')"
      - name: Calibration example runs
        run: python skills/decide/scripts/calibrate.py examples/predictions.jsonl
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py'
